<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" fill="none">
  <defs>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D78"/>
      <stop offset="100%" stop-color="#FF6BAE"/>
    </linearGradient>
    <linearGradient id="pg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D78"/>
      <stop offset="100%" stop-color="#FF6BAE"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon: barbell / T shape -->
  <g transform="translate(4,8)">
    <!-- bar -->
    <rect x="14" y="19" width="22" height="5" rx="2.5" fill="url(#pg)"/>
    <!-- left weight plate -->
    <rect x="7"  y="13" width="7"  height="17" rx="3" fill="url(#pg)" opacity=".9"/>
    <!-- right weight plate -->
    <rect x="36" y="13" width="7"  height="17" rx="3" fill="url(#pg)" opacity=".9"/>
    <!-- left end cap -->
    <rect x="4"  y="16" width="4"  height="11" rx="2" fill="#FF6BAE" opacity=".6"/>
    <!-- right end cap -->
    <rect x="43" y="16" width="4"  height="11" rx="2" fill="#FF6BAE" opacity=".6"/>
    <!-- glow dot center -->
    <circle cx="25" cy="21.5" r="3" fill="#fff" opacity=".15"/>
  </g>

  <!-- Text: تهیلا -->
  <text
    x="68" y="42"
    font-family="'Vazirmatn','Tahoma',sans-serif"
    font-weight="900"
    font-size="28"
    fill="url(#pg2)"
    filter="url(#glow)"
    letter-spacing="-0.5"
  >تهیلا</text>

  <!-- tagline -->
  <text
    x="69" y="54"
    font-family="'Vazirmatn','Tahoma',sans-serif"
    font-weight="400"
    font-size="9"
    fill="#888"
    letter-spacing="1"
  >TAHILA GYM</text>

  <!-- accent line under logo text -->
  <rect x="68" y="44.5" width="70" height="2" rx="1" fill="url(#pg2)" opacity=".35"/>
</svg>
