<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" fill="none">
  <defs>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D78"/>
      <stop offset="100%" stop-color="#FF6BAE"/>
    </linearGradient>
    <linearGradient id="pg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D78"/>
      <stop offset="100%" stop-color="#FF6BAE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background circle glow -->
  <circle cx="140" cy="52" r="48" fill="#FF2D78" opacity=".04"/>
  <circle cx="140" cy="52" r="36" fill="#FF2D78" opacity=".06"/>

  <!-- barbell icon centered -->
  <g transform="translate(91,26)">
    <!-- bar -->
    <rect x="22" y="23" width="54" height="7" rx="3.5" fill="url(#pg)"/>
    <!-- left plate big -->
    <rect x="9"  y="14" width="13" height="25" rx="4" fill="url(#pg)" opacity=".95"/>
    <!-- right plate big -->
    <rect x="76" y="14" width="13" height="25" rx="4" fill="url(#pg)" opacity=".95"/>
    <!-- left plate small -->
    <rect x="3"  y="18" width="7"  height="17" rx="3" fill="#FF6BAE" opacity=".7"/>
    <!-- right plate small -->
    <rect x="88" y="18" width="7"  height="17" rx="3" fill="#FF6BAE" opacity=".7"/>
    <!-- glow center -->
    <circle cx="49" cy="26.5" r="5" fill="#fff" opacity=".1" filter="url(#glow)"/>
  </g>

  <!-- main text -->
  <text
    x="140" y="118"
    text-anchor="middle"
    font-family="'Vazirmatn','Tahoma',sans-serif"
    font-weight="900"
    font-size="52"
    fill="url(#pg2)"
    filter="url(#softglow)"
  >تهیلا</text>

  <!-- tagline -->
  <text
    x="140" y="140"
    text-anchor="middle"
    font-family="'Vazirmatn','Tahoma',sans-serif"
    font-weight="300"
    font-size="12"
    fill="#666"
    letter-spacing="4"
  >TAHILA FITNESS CLUB</text>

  <!-- decorative lines -->
  <rect x="60" y="146" width="40" height="1.5" rx="1" fill="url(#pg)" opacity=".4"/>
  <rect x="180" y="146" width="40" height="1.5" rx="1" fill="url(#pg)" opacity=".4"/>
  <circle cx="140" cy="146.75" r="2.5" fill="#FF2D78" opacity=".7"/>
</svg>
